<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container">
        <h1>Welcome Back</h1>
        <p class="subtitle">Please enter your credentials to log in.</p>

        {% if error %}
        <div class="alert-error">
            <p> {{ error }}</p>
        </div>
        {% endif %}

        <form action="/login" method="post">
            <div class="form-group">
                <label for="user_email">Email Address</label>
                <input type="email" name="email" id="user_email" placeholder="nick@example.com" required>
            </div>

            <div class="form-group">
                <label for="user_password">Password</label>
                <input type="password" name="password" id="user_password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>

        <p class="footer-text">
            Don't have an account? <a href="/register" class="text-link">Register here</a>
        </p>
    </div>
</body>

</html>
