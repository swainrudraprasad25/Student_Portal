<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Student Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <p class="subtitle">Register your student account to get started.</p>

        {% if errors %}
        <div class="alert-error">
            {% for error in errors %}
                <p>• {{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form action="/register" method="post">
            <div class="form-group">
                <label for="user_name">Full Name</label>
                <input type="text" name="name" id="user_name" placeholder="Nick" required>
            </div>

            <div class="form-group">
                <label for="user_email">Email Address</label>
                <input type="email" name="email" id="user_email" placeholder="nick@example.com" required>
            </div>

            <div class="form-group">
                <label for="user_password">Password</label>
                <input type="password" name="password" id="user_password" placeholder="At least 8 characters" minlength="8" required>
            </div>

            <button type="submit" class="btn">Register</button>
        </form>

        <p class="footer-text">
            Already have an account? <a href="/login" class="text-link">Login here</a>
        </p>
    </div>
</body>
</html>
