<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Student Portal</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container wide">
        <h1>Admin Control Panel</h1>
        <p class="subtitle">Restricted access: Viewing all registered student accounts.</p>

        <table class="styled-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email Address</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody>
                {% for u in all_users %}
                <tr>
                    <td>#{{ u.id }}</td>
                    <td>{{ u.name }}</td>
                    <td>{{ u.email }}</td>
                    <td>
                        <span class="badge {% if u.role == 'admin' %}badge-admin{% else %}badge-student{% endif %}">
                            {{ u.role }}
                        </span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="nav-links">
            <a href="/dashboard" class="btn btn-secondary">Back to Dashboard</a>
            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>
    </div>
</body>
</html>
